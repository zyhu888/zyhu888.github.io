name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare site artifact
        run: |
          mkdir -p _site
          cp pages/*.html _site/
          mkdir -p _site/assets
          cp -R assets/css assets/icons assets/images assets/js assets/logos _site/assets/
          cp assets/documents/Zeyu_Hu_Resume.pdf _site/Zeyu_Hu_Resume.pdf
          cp -R papers _site/
          cp .nojekyll _site/.nojekyll
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
