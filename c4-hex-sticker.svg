<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="600" height="693" viewBox="0 0 600 693">
  <defs>
    <clipPath id="hexclip">
      <polygon points="300,10.5 591,178.5 591,514.5 300,682.5 9,514.5 9,178.5"/>
    </clipPath>
  </defs>

  <!-- hexagon body -->
  <polygon points="300,10.5 591,178.5 591,514.5 300,682.5 9,514.5 9,178.5"
           fill="#FAF2E6" stroke="#17706B" stroke-width="17" stroke-linejoin="round"/>

  <g clip-path="url(#hexclip)">
    <!-- community halos -->
    <circle cx="190" cy="357" r="88" fill="#17706B" opacity="0.09"/>
    <circle cx="412" cy="358" r="88" fill="#E08A2E" opacity="0.11"/>
    <circle cx="301" cy="529" r="78" fill="#8A5FA8" opacity="0.10"/>

    <!-- between-community edges (weak) -->
    <g stroke="#B9B4AC" stroke-linecap="round" fill="none">
      <line x1="215" y1="300" x2="388" y2="300" stroke-width="2.2"/>
      <line x1="205" y1="415" x2="255" y2="505" stroke-width="2.2"/>
      <line x1="398" y1="418" x2="348" y2="505" stroke-width="2.2"/>
      <line x1="450" y1="355" x2="388" y2="300" stroke-width="0"/>
    </g>

    <!-- within-community edges (strong / weighted) -->
    <g stroke="#3D3A36" stroke-linecap="round" fill="none">
      <line x1="150" y1="355" x2="215" y2="300" stroke-width="5"/>
      <line x1="215" y1="300" x2="205" y2="415" stroke-width="3.6"/>
      <line x1="150" y1="355" x2="205" y2="415" stroke-width="4.4"/>

      <line x1="450" y1="355" x2="388" y2="300" stroke-width="4.4"/>
      <line x1="388" y1="300" x2="398" y2="418" stroke-width="3.6"/>
      <line x1="450" y1="355" x2="398" y2="418" stroke-width="5"/>

      <line x1="255" y1="505" x2="348" y2="505" stroke-width="4.4"/>
      <line x1="348" y1="505" x2="300" y2="578" stroke-width="3.6"/>
      <line x1="255" y1="505" x2="300" y2="578" stroke-width="5"/>
    </g>

    <!-- nodes: core = community, ring = node covariate -->
    <g stroke-width="8">
      <circle cx="150" cy="355" r="18" fill="#17706B" stroke="#8FD0CA"/>
      <circle cx="215" cy="300" r="18" fill="#17706B" stroke="#8FD0CA"/>
      <circle cx="205" cy="415" r="18" fill="#17706B" stroke="#8FD0CA"/>

      <circle cx="450" cy="355" r="18" fill="#E08A2E" stroke="#F7CE93"/>
      <circle cx="388" cy="300" r="18" fill="#E08A2E" stroke="#F7CE93"/>
      <circle cx="398" cy="418" r="18" fill="#E08A2E" stroke="#F7CE93"/>

      <circle cx="255" cy="505" r="18" fill="#8A5FA8" stroke="#CDB3E0"/>
      <circle cx="348" cy="505" r="18" fill="#8A5FA8" stroke="#CDB3E0"/>
      <circle cx="300" cy="578" r="18" fill="#8A5FA8" stroke="#CDB3E0"/>
    </g>
  </g>

  <!-- package name -->
  <text x="300" y="252" text-anchor="middle" font-family="Quicksand" font-weight="bold"
        font-size="165" letter-spacing="3" fill="#17706B">c4</text>
</svg>
